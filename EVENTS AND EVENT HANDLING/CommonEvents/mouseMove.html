<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: "gilroy";
            box-sizing: border-box;
        }
        body{
            /*this should never be applied to the body, it should be applied to the main div*/
            position: relative;
            overflow: hidden;
        }
        html,body{
            width: 100%;
            height: 100%;
            background-color: powderblue;
        }
        .abcd{
            position: absolute;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) 1s;
            width: 400px;
            height: 400px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="abcd"></div>
    <script src="mouseMove.js"></script>
</body>
</html>
